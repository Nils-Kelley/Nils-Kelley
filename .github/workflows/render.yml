name: render
# Re-renders the profile picture with the current time and live data, then publishes the two SVGs
# to the orphan "render" branch (force-pushed, so the repo never grows).
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}   # optional: a personal token so private pushes count in the hours scene
        run: node scripts/render.js
      - name: Publish to the render branch
        run: |
          cd out
          git init -q
          git checkout -q -b render
          git config user.name "render-bot"
          git config user.email "render-bot@users.noreply.github.com"
          git add field-dark.svg field-light.svg
          git commit -q -m "render $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" render
